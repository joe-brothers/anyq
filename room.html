<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>anyQ 질문 방</title>
		<meta name="robots" content="noindex" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1512'/%3E%3Cg fill='none' stroke='%23f5f0e8' stroke-width='4'%3E%3Ccircle cx='15.5' cy='15.5' r='7.5'/%3E%3Cpath d='M19 19l6 6'/%3E%3C/g%3E%3C/svg%3E"
		/>
		<script>
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem("anyq-theme") ||
					(matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
			} catch (e) {}
		</script>
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
		/>
		<link rel="stylesheet" href="/styles.css" />
		<link rel="stylesheet" href="/room.css" />
		<script type="module" src="/src/client/room.js"></script>
	</head>
	<body class="room">
		<header class="top">
			<a class="logo" href="/" data-i18n-label="logo.label" aria-label="anyQ 처음으로">anyQ</a>
			<div class="tools">
				<p class="conn" id="conn" role="status"></p>
				<button class="btn tool" type="button" id="lang" hidden></button>
				<button class="btn tool" type="button" id="theme" hidden></button>
			</div>
		</header>

		<main>
			<h1 class="sr" id="title" data-i18n="room.h">질문 방</h1>

			<div class="panels" id="panels" hidden>
				<section class="panel" aria-labelledby="share-h">
					<h2 id="share-h" data-i18n="share.h">공유</h2>
					<div class="row">
						<a class="url" id="link-aud" href="#"></a>
						<button class="btn" type="button" id="copy"></button>
						<a class="btn" id="link-screen" href="#" target="_blank" rel="noopener"
							><span data-icon="screen"></span
							><span data-i18n="share.screen">프로젝터 화면</span></a
						>
					</div>
					<p class="note">
						<span data-icon="lock"></span
						><span data-i18n="share.note"
							>이 페이지 주소는 공유하지 마세요. 발표자 권한이 들어 있습니다.</span
						>
					</p>
					<p class="note" id="expires"></p>
				</section>

				<section class="panel" aria-labelledby="mat-h">
					<h2 id="mat-h" data-i18n="mat.h">자료</h2>
					<div class="row">
						<label class="btn" for="file" id="file-label"></label
						><input class="sr" id="file" type="file" accept=".pdf,.txt,.md" />
						<span class="note" data-i18n="mat.hint">PDF · TXT · MD, 10MiB까지</span>
					</div>
					<p class="err" id="file-err" role="alert"></p>
					<ul class="files" id="file-list"></ul>
					<p class="note" id="file-note" role="status"></p>
				</section>
			</div>

			<div class="bar" id="bar" hidden>
				<p class="total" id="total"></p>
				<button class="btn" type="button" id="review" aria-pressed="false"></button>
				<button class="btn" type="button" id="export"></button>
			</div>
			<p class="note keys" id="keys" data-i18n="keys" hidden></p>
			<div class="stage">
				<div class="list">
					<p class="empty" id="msg" hidden></p>
					<ol class="qs" id="qs" aria-labelledby="title"></ol>
					<details class="hidden-box" id="hidden" hidden>
						<summary id="hidden-sum"></summary>
						<ol class="qs" id="hidden-qs"></ol>
					</details>
				</div>
				<aside class="join" id="join" hidden data-i18n-label="join" aria-label="QR로 질문하기">
					<div class="qr" id="qr"></div>
					<p data-i18n="join">QR로 질문하기</p>
					<p class="join-url" id="join-url"></p>
				</aside>
			</div>

			<form class="ask dock" id="ask" novalidate hidden>
				<label for="q" data-i18n="ask.label">질문</label>
				<div class="ask-row">
					<input
						id="q"
						name="q"
						type="text"
						maxlength="200"
						autocomplete="off"
						data-i18n-ph="ask.ph"
						placeholder="발표자에게 묻고 싶은 것"
						aria-describedby="q-err"
					/>
					<button class="btn primary" type="submit" data-i18n="ask.submit">올리기</button>
				</div>
				<p class="err" id="q-err" role="alert"></p>
			</form>
			<p class="sr" id="live" aria-live="polite"></p>
		</main>
	</body>
</html>
