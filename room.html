<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anyq 질문 방</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/room.css">
<script type="module" src="/src/client/room.js"></script>
</head>
<body class="room">
<header class="top">
  <a class="logo" href="/" aria-label="anyq 처음으로">anyq</a>
  <p class="conn" id="conn" role="status">방에 연결하는 중입니다.</p>
</header>

<main>
  <h1 class="sr" id="title">질문 방</h1>

  <section class="share" id="share" hidden aria-labelledby="share-h">
    <h2 id="share-h">청중에게 보여 줄 것</h2>
    <p>청중 링크 <a id="link-aud" href="#"></a> <button class="btn" type="button" id="copy">링크 복사</button></p>
    <p>프로젝터 화면 <a id="link-screen" href="#" target="_blank" rel="noopener">새 창으로 열기</a></p>
    <p class="note">지금 보는 주소는 발표자만 아는 주소입니다. 공유하지 마세요.</p>
  </section>

  <section class="share" id="materials" hidden aria-labelledby="mat-h">
    <h2 id="mat-h">발표 자료</h2>
    <p><label class="btn file-btn" for="file" id="file-label">발표 자료 올리기</label><input class="sr" id="file" type="file" accept=".pdf,.txt,.md"> <span class="note">PDF, TXT, MD · 10MiB 이하</span></p>
    <p class="err" id="file-err" role="alert"></p>
    <ul class="files" id="file-list"></ul>
    <p class="note" id="file-note" role="status"></p>
  </section>

  <div class="stage">
    <div class="list">
      <p class="empty" id="msg" hidden></p>
      <ol class="qs" id="qs" aria-labelledby="title"></ol>
    </div>
    <aside class="join" id="join" hidden aria-label="참여 방법">
      <div class="qr" id="qr"></div>
      <p>카메라로 찍어 질문하세요</p>
      <p class="join-url" id="join-url"></p>
    </aside>
  </div>

  <form class="ask dock" id="ask" novalidate hidden>
    <label for="q">질문 적기</label>
    <div class="ask-row">
      <input id="q" name="q" type="text" maxlength="200" autocomplete="off" placeholder="발표자에게 묻고 싶은 것" aria-describedby="q-err">
      <button class="btn primary" type="submit">질문 올리기</button>
    </div>
    <p class="err" id="q-err" role="alert"></p>
  </form>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
</body>
</html>
